<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">LoloBuy warehouse storage planning timeline</title><desc id="d">An editorial timeline showing arrival, quality check, grouping and parcel decision before the storage boundary.</desc><rect width="1200" height="630" fill="#070b18"/><rect x="44" y="44" width="1112" height="542" rx="32" fill="#11172b" stroke="#2f3b58" stroke-width="2"/><text x="92" y="126" fill="#98ff29" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">WAREHOUSE STORAGE PLANNER</text><text x="92" y="184" fill="#f6f8ff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Use decision gates, not the last available day.</text><line x1="130" y1="350" x2="1070" y2="350" stroke="#5e6d91" stroke-width="8"/><g font-family="Arial,sans-serif"><g transform="translate(150 350)"><circle r="42" fill="#98ff29"/><text x="-15" y="9" fill="#071008" font-size="25" font-weight="700">01</text><text x="-50" y="86" fill="#f6f8ff" font-size="22" font-weight="700">ARRIVE</text><text x="-73" y="116" fill="#aeb9d4" font-size="16">Record date + option</text></g><g transform="translate(430 350)"><circle r="42" fill="#e7c36f"/><text x="-15" y="9" fill="#071008" font-size="25" font-weight="700">02</text><text x="-24" y="86" fill="#f6f8ff" font-size="22" font-weight="700">QC</text><text x="-69" y="116" fill="#aeb9d4" font-size="16">Pass, question, action</text></g><g transform="translate(710 350)"><circle r="42" fill="#79b8db"/><text x="-15" y="9" fill="#071008" font-size="25" font-weight="700">03</text><text x="-54" y="86" fill="#f6f8ff" font-size="22" font-weight="700">GROUP</text><text x="-71" y="116" fill="#aeb9d4" font-size="16">Compatible items only</text></g><g transform="translate(990 350)"><circle r="42" fill="#ef8f6a"/><text x="-15" y="9" fill="#071008" font-size="25" font-weight="700">04</text><text x="-57" y="86" fill="#f6f8ff" font-size="22" font-weight="700">SUBMIT</text><text x="-86" y="116" fill="#aeb9d4" font-size="16">Before personal deadline</text></g></g></svg>
